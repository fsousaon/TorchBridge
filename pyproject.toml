[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torchbridge"
version = "0.1.0"
description = "Controller bridge and low-latency overlay for Torchlight (PC)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "FSOUSA SOLUÇÕES" }]
dependencies = [
  "pygame-ce>=2.5.3,<3",
  "PySide6>=6.8,<7",
]

[project.gui-scripts]
torchbridge = "torchbridge.app:main"

[project.scripts]
torchbridge-calibrar = "torchbridge.calibrate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
